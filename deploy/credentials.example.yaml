# Document de credentials de dsh.
# Destination : $DSH_HOME/.credentials.yaml — soit /home/dsh/.dsh/.credentials.yaml
#
#   sudo chown dsh:dsh /home/dsh/.dsh/.credentials.yaml
#   sudo chmod 600     /home/dsh/.dsh/.credentials.yaml
#
# Le mode 600 sous un répertoire 700 est une précondition, pas une suggestion :
# sur POSIX, tout bit groupe ou autre fait échouer la lecture avant l'analyse du
# contenu, au boot comme au rechargement à chaud.
#
# Le format est exactement une table clé/valeur : pas de champ `version`, pas de
# niveau d'emballage. Racine non-mapping, clé non conforme à un identifiant
# POSIX, valeur non-chaîne, chaîne vide, clé dupliquée ou YAML invalide sont
# rejetés — jamais ignorés silencieusement.
#
# Précédence des sources, de la plus forte à la plus faible :
#   1. environnement du processus  (lecture seule, non modifiable depuis l'UI)
#   2. ce document                 (écrit par la page Settings → Models)
#   3. .env du répertoire courant
#   4. $DSH_HOME/.env
#
# Les éditions externes sont publiées à chaud, sans redémarrer le service.

DEEPSEEK_API_KEY: sk-remplacez-par-votre-cle

# Autres fournisseurs, si vous en configurez dans settings.yaml :
#OPENAI_API_KEY: sk-...
#ANTHROPIC_API_KEY: sk-ant-...
#GATEWAY_API_KEY: ...
